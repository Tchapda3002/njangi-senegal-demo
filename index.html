<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Bokk · Mon espace</title>
    <style>
      :root {
        --ink: #151b32;
        --muted: #606b79;
        --gold: #855d22;
        --navy: #121936;
        --line: #e4e7eb;
        --cream: #f6eedc;
        --safe: env(safe-area-inset-bottom, 0px);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: #e7eaf0;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        max-width: 470px;
        min-height: 100dvh;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 0 64px #27355110;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      summary {
        cursor: pointer;
      }
      button {
        color: inherit;
        touch-action: manipulation;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #ac7d2d;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.6;
      }
      header {
        background: #fff;
        padding: env(safe-area-inset-top, 0px) 19px 0;
      }
      .bar {
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        background: #1c2445;
        border-radius: 50%;
        color: #fff;
        font-size: 14px;
        font-weight: 650;
      }
      .identity {
        display: grid;
        gap: 1px;
      }
      .identity > span,
      .small,
      small,
      .quiet {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }
      .who {
        max-width: 175px;
        background: #fff;
        border: 0;
        font-size: 17px;
        font-weight: 720;
        color: var(--ink);
        padding: 2px 1px;
      }
      .bar > button {
        position: relative;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 0;
        background: none;
      }
      .bar > button b {
        position: absolute;
        right: 2px;
        top: 2px;
        font-size: 10px;
        background: #983c38;
        color: white;
        padding: 2px 5px;
        border-radius: 10px;
      }
      .wrap {
        padding: 3px 18px calc(94px + var(--safe));
      }
      .sr {
        position: absolute;
        clip-path: inset(50%);
        width: 1px;
        height: 1px;
        overflow: hidden;
        white-space: nowrap;
      }
      .balance,
      .feature {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        color: white;
        background: linear-gradient(
          117deg,
          #293358 0,
          #141d3d 50%,
          #0b1228 90%
        );
        border: 1px solid #1a2242;
        border-radius: 21px;
        padding: 22px 21px 16px;
      }
      .balance:after,
      .feature:after {
        content: "";
        position: absolute;
        z-index: -1;
        right: -107px;
        bottom: -160px;
        width: 310px;
        height: 305px;
        transform: rotate(-24deg) scaleX(1.65);
        border-radius: 50%;
        background: repeating-radial-gradient(
          ellipse at center,
          transparent 0 7px,
          #c6b87a55 7.4px 8px,
          transparent 8.4px 12px
        );
        mask-image: linear-gradient(130deg, transparent 9%, black 55%, black);
      }
      .cardbrand {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 23px;
        font-weight: 750;
        letter-spacing: -1.5px;
        color: #f8e4a6;
      }
      .cardbrand i {
        width: 21px;
        height: 21px;
        display: block;
        transform: rotate(-20deg);
        background: repeating-linear-gradient(
          90deg,
          transparent 0 2px,
          #efd690 2px 5px
        );
        border-radius: 50% 12% 50% 12%;
      }
      .balance-label {
        font-size: 13px;
        color: #e3e5eb;
        margin: 23px 0 3px;
      }
      .sum {
        font:
          500 clamp(39px, 11vw, 53px)/1.06 ui-rounded,
          "Avenir Next",
          system-ui,
          sans-serif;
        letter-spacing: -2.6px;
        color: #f5dc92;
        font-variant-numeric: tabular-nums;
      }
      .sum span {
        font-size: 13px;
        letter-spacing: 0.2px;
        color: #e4e3db;
        font-weight: 550;
      }
      .balance-foot {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        margin-top: 22px;
        font-size: 12px;
        color: #e8eaf3;
      }
      .decisionstrip {
        width: calc(100% - 14px);
        margin: 0 7px;
        background: #f7ede7;
        border: 0;
        border-radius: 0 0 15px 15px;
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
        color: #823f31;
        padding: 12px 14px;
      }
      .decisionstrip > span:first-child {
        display: grid;
        place-items: center;
      }
      .decisionstrip > svg:last-child {
        width: 15px;
        margin-left: auto;
      }
      .decisionstrip strong,
      .task strong,
      .rowbtn strong,
      .row strong {
        font-weight: 650;
        display: block;
        font-size: 14px;
      }
      .decisionstrip small {
        font-size: 12px;
        color: #824e40;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 29px;
        line-height: 1.18;
        letter-spacing: -1.2px;
        margin: 5px 0 21px;
      }
      h2 {
        font-size: 20px;
        line-height: 1.25;
        letter-spacing: -0.6px;
        margin: 22px 0 12px;
      }
      h3 {
        font-size: 16px;
      }
      .eyebrow,
      .badge {
        font-size: 12px;
        color: var(--muted);
      }
      .sectiontop {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 20px 0 3px;
        min-height: 34px;
      }
      .sectiontop h2 {
        margin: 0;
        font-size: 19px;
      }
      .quiet {
        font-size: 12px;
      }
      .link,
      .back {
        background: none;
        border: 0;
        color: var(--gold);
        font-size: 13px;
        font-weight: 650;
        padding: 10px 2px;
        min-height: 44px;
      }
      .back {
        color: var(--muted);
      }
      .sectiontop .link {
        min-height: 34px;
      }
      .list,
      .actionlist,
      .stack,
      .grid {
        display: grid;
      }
      .grid,
      .stack {
        gap: 13px;
      }
      .task,
      .rowbtn,
      .row {
        background: white;
        border: 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 64px;
        gap: 11px;
        text-align: left;
        padding: 11px 0;
      }
      .task:hover,
      .rowbtn:hover {
        background: #faf9f5;
      }
      .taskicon,
      .icon {
        display: grid;
        place-items: center;
        width: 35px;
        height: 37px;
        flex-shrink: 0;
        color: var(--gold);
      }
      .task small,
      .rowbtn small,
      .row small {
        display: block;
        font-size: 12px;
        margin-top: 3px;
      }
      .tasktext {
        min-width: 0;
      }
      .tail,
      .right,
      .arrow {
        margin-left: auto;
        color: var(--gold);
        text-align: right;
      }
      .tail {
        border-radius: 14px;
        background: var(--cream);
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }
      .tail:has(svg) {
        padding: 0;
        background: none;
      }
      .tail svg {
        width: 15px;
      }
      .icon {
        border: 1px solid #dddce5;
        border-radius: 11px;
        background: #eeeff6;
        color: #424b6f;
        font-size: 15px;
        font-weight: 650;
      }
      .icon.gold {
        background: #f6f0df;
        color: #7b5c1d;
        border-color: #e9dec4;
      }
      .arrow {
        font-size: 17px;
        color: var(--muted);
      }
      .reading {
        min-width: 0;
      }
      #nav {
        position: fixed;
        z-index: 3;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(470px, 100%);
        height: calc(67px + var(--safe));
        padding: 4px 8px calc(4px + var(--safe));
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        align-items: end;
        background: #fffffff7;
        backdrop-filter: blur(16px);
        border-top: 1px solid var(--line);
      }
      .nav {
        border: 0;
        background: none;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 4px;
        height: 55px;
        color: #65707e;
        font-size: 10.5px;
        font-weight: 570;
      }
      .nav svg {
        width: 20px;
        height: 20px;
      }
      .nav.on {
        color: #845817;
        font-weight: 750;
      }
      .nav.on svg {
        fill: #e8d8aa70;
      }
      .central i {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: var(--navy);
        box-shadow: 0 3px 7px #11182e1c;
      }
      .central {
        gap: 2px;
      }
      .card {
        background: #f8f9fb;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        min-width: 0;
      }
      .card h2:first-child {
        margin-top: 0;
      }
      .card .rowbtn,
      .card .row {
        background: transparent;
      }
      .card h2,
      .feature h2 {
        margin-top: 10px;
      }
      .feature .eyebrow {
        color: #d7d9e4;
      }
      .feature h2 {
        color: #f1d996;
        font-size: 32px;
      }
      .feature p {
        font-size: 13px;
      }
      .bodycopy,
      .hint,
      .blank,
      .card > p {
        font-size: 14px;
        line-height: 1.5;
      }
      .blank,
      .hint {
        margin: 10px 0;
        padding: 12px;
        border-radius: 10px;
        background: #f0ede4;
      }
      .blank {
        background: #f4f5f7;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        background: #efe5ca;
        color: #795c24;
        border-radius: 20px;
        padding: 4px 10px;
        font-weight: 650;
      }
      .fact {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        font-size: 13px;
        line-height: 1.5;
      }
      .fact strong {
        text-align: right;
      }
      .fact span {
        color: var(--muted);
      }
      .facts {
        display: grid;
        gap: 9px;
        margin: 15px 0;
      }
      .rule {
        border-top: 1px solid var(--line);
        margin: 15px 0;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .btn,
      .ghost,
      .light,
      .danger {
        border: 0;
        background: var(--navy);
        color: white;
        border-radius: 12px;
        min-height: 45px;
        padding: 11px 15px;
        font-weight: 650;
        font-size: 14px;
      }
      .ghost {
        background: white;
        color: var(--ink);
        border: 1px solid #cfd4dc;
      }
      .light {
        background: #f2da96;
        color: #25202a;
      }
      .danger {
        background: #f7e8e6;
        color: #863a37;
      }
      .wide-btn {
        width: 100%;
      }
      .calendar {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      .calendar td,
      .calendar th {
        padding: 10px 3px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      .calendar th {
        font-weight: 550;
        color: var(--muted);
      }
      summary {
        padding: 10px 0;
        font-size: 14px;
        color: var(--gold);
        font-weight: 600;
        min-height: 44px;
      }
      .meter {
        display: flex;
        gap: 3px;
        margin-top: 12px;
      }
      .meter i {
        flex: 1;
        height: 5px;
        background: #dce0e7;
        border-radius: 3px;
      }
      .meter i.ok,
      .pulse i {
        background: #977329;
      }
      .pulse {
        height: 6px;
        background: #e6e6e1;
        border-radius: 3px;
        overflow: hidden;
        margin: 10px 0;
      }
      .pulse i {
        display: block;
        height: 100%;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 20px;
        color: var(--muted);
        font-size: 11px;
      }
      .footer .link {
        font-size: 11px;
      }
      .sheet {
        position: fixed;
        inset: auto 0 0;
        margin: 0 auto;
        width: min(470px, 100%);
        max-width: 100%;
        max-height: 88dvh;
        border: 0;
        border-radius: 22px 22px 0 0;
        padding: 12px 21px calc(24px + var(--safe));
        background: #fff;
        color: var(--ink);
        overflow: auto;
      }
      .sheet::before {
        content: "";
        display: block;
        width: 38px;
        height: 4px;
        border-radius: 3px;
        background: #ced2da;
        margin: 0 auto 15px;
      }
      .sheet::backdrop {
        background: #0c132856;
      }
      .sheet h2 {
        margin: 9px 38px 18px 0;
        font-size: 23px;
      }
      .close {
        float: right;
        width: 44px;
        height: 44px;
        border: 0;
        background: #f1f3f6;
        border-radius: 12px;
        font-size: 23px;
      }
      .field {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 650;
        margin: 14px 0;
      }
      .field input,
      .field textarea,
      .field select,
      .shareinput {
        background: #fff;
        color: var(--ink);
        border: 1px solid #ccd1da;
        border-radius: 10px;
        width: 100%;
        padding: 10px;
        min-height: 46px;
        font-size: 16px;
      }
      .field input[readonly] {
        background: #f5f6f8;
      }
      .check {
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
      }
      .err {
        color: #a43b39;
        font-size: 13px;
        margin: 7px 0;
      }
      .notice {
        position: fixed;
        z-index: 4;
        bottom: calc(77px + var(--safe));
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: min(90vw, 420px);
        padding: 11px 15px;
        border-radius: 12px;
        background: var(--navy);
        color: white;
        font-size: 13px;
      }
      .notice:empty {
        display: none;
      }
      @media (min-width: 650px) {
        :root {
          background: radial-gradient(ellipse at 45% 25%, #f5f6f8, #e4e7ed);
        }
        body {
          border-inline: 1px solid #d7dce3;
        }
      }
      @media (max-width: 350px) {
        .wrap {
          padding-inline: 13px;
        }
        .tail {
          font-size: 10px;
        }
        .task {
          gap: 6px;
        }
        .taskicon {
          width: 29px;
        }
      }

      :root {
        --device-w: min(412px, calc(100vw - 30px));
        --device-h: min(844px, calc(100dvh - 34px));
        --rim: 8px;
        --outer-radius: 51px;
      }
      html {
        background: radial-gradient(
          ellipse at 50% 24%,
          #f9f9f6 0%,
          #e9e9e5 72%,
          #dddfdc
        );
        min-height: 100%;
      }
      body {
        height: 100dvh;
        min-height: 0;
        max-width: none;
        background: transparent;
        box-shadow: none;
        border: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .handset {
        position: relative;
        width: var(--device-w);
        height: var(--device-h);
        border: 2px solid #54575b;
        border-radius: var(--outer-radius);
        padding: calc(var(--rim) - 2px);
        background: linear-gradient(
          130deg,
          #3c3e44,
          #08090b 12%,
          #1d1f26 59%,
          #35383b
        );
        box-shadow:
          0 1px 0 1px #85868a,
          0 22px 46px -18px #20273166,
          0 3px 9px #14192222;
      }
      .handset::before,
      .handset::after {
        content: "";
        position: absolute;
        width: 3px;
        background: #55565c;
        border-radius: 3px;
      }
      .handset::before {
        left: -4px;
        top: 20%;
        height: 52px;
      }
      .handset::after {
        right: -4px;
        top: 27%;
        height: 58px;
      }
      .glass {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: calc(var(--outer-radius) - var(--rim));
        overflow: hidden;
        position: relative;
        isolation: isolate;
      }
      .statusbar {
        height: 30px;
        flex: none;
        padding: 7px 28px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #1b2030;
        font: 650 11px/1 system-ui;
      }
      .statusbar i {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        width: 71px;
        height: 18px;
        background: #101115;
        border-radius: 20px;
      }
      .statusbar span {
        letter-spacing: -1px;
        font-size: 10px;
      }
      header {
        padding: 0 18px;
        flex: none;
      }
      .bar {
        height: 54px;
      }
      .bar > .profile {
        display: flex;
        width: auto;
        gap: 9px;
        justify-content: start;
        text-align: left;
      }
      .identity {
        font-size: 15px;
      }
      .identity > span {
        font-size: 11px;
      }
      .avatar {
        width: 36px;
        height: 36px;
      }
      .wrap {
        overflow-y: auto;
        overflow-x: hidden;
        flex: 1;
        min-height: 0;
        width: 100%;
        overscroll-behavior: contain;
        padding: 3px 16px 20px;
        scrollbar-width: thin;
        scrollbar-color: #d6d7d9 transparent;
      }
      .wrap:focus {
        outline: none;
      }
      #nav {
        position: relative;
        inset: auto;
        transform: none;
        flex: none;
        width: 100%;
        height: 65px;
        padding: 1px 6px 12px;
      }
      .glass:after {
        content: "";
        height: 4px;
        border-radius: 8px;
        width: 90px;
        position: absolute;
        bottom: 5px;
        left: 50%;
        transform: translateX(-50%);
        background: #1a1c25;
        pointer-events: none;
        z-index: 5;
      }
      .nav {
        height: 47px;
      }
      .central i {
        width: 39px;
        height: 39px;
      }
      .sheet {
        left: 50%;
        right: auto;
        bottom: calc((100dvh - var(--device-h)) / 2 + var(--rim));
        transform: translateX(-50%);
        width: calc(var(--device-w) - 2 * var(--rim));
        max-height: calc(var(--device-h) - 65px);
        border-radius: 23px 23px calc(var(--outer-radius) - var(--rim))
          calc(var(--outer-radius) - var(--rim));
        padding-bottom: 24px;
      }
      .sheet::backdrop {
        background: #12172745;
      }
      .notice {
        bottom: calc((100dvh - var(--device-h)) / 2 + 77px);
        max-width: calc(var(--device-w) - 44px);
      }
      .face,
      .reverse {
        width: 100%;
        min-height: 154px;
        text-align: left;
        padding: 15px 19px 13px;
        border-radius: 18px;
      }
      .cardtop {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .cardtop > svg {
        color: #ddcb97;
        width: 17px;
      }
      .balance-label {
        margin: 12px 0 2px;
        font-size: 12px;
      }
      .sum {
        font-size: 40px;
      }
      .balance-foot {
        margin-top: 12px;
        border-top: 1px solid #ffffff29;
        padding-top: 9px;
        align-items: center;
        font-size: 11px;
      }
      .balance-foot b {
        font-size: 14px;
      }
      .cardbrand {
        font-size: 19px;
      }
      .duedate {
        display: block;
        padding: 7px 0;
        color: white;
      }
      .duedate small {
        display: block;
        color: #ebdfb9;
      }
      .duelist {
        display: block;
        max-height: 112px;
        overflow-y: auto;
        overscroll-behavior: contain;
        touch-action: pan-y;
      }
      .member-status {
        margin-left: auto;
        font-size: 13px;
        font-weight: 650;
        white-space: nowrap;
        color: var(--muted);
      }
      .member-status.settled {
        color: #197048;
      }

  <body>
    <div class="handset">
      <div class="glass">
        <div class="statusbar" aria-hidden="true">
          <b>9:41</b><i></i><span class="radios"><em></em><b></b></span>

                ><span>Bonjour</span><strong id="personName"></strong
              ></span></button

              id="alerts"

    <dialog id="modal" class="sheet" aria-labelledby="modalTitle"></dialog>
    <div class="notice" role="status" id="notice"></div>
    <script>
      "use strict";
      const basePeople = [
        "Awa Fall",
        "Fatou Ndiaye",
        "Mariama Ba",
        "Aminata Sow",
        "Oumar Diop",
        "Sokhna Diallo",
        "Moussa Sy",
        "Khady Sarr",
        "Adama Gueye",
        "Binta Kane",
        "Cheikh Faye",
        "Coumba Dieng",
      ];
      const baseGroups = {
        samedi: { name: "Tontine du samedi", direct: true, fee: 10000 },
        quartier: { name: "Tontine du quartier", direct: false, fee: 5000 },
      };
      const money = (n) => Number(n).toLocaleString("fr-FR") + " F CFA";
      const first = (id) => people[id].split(" ")[0];
      const h = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const members = basePeople.map((_, i) => i);
      const circles = members.map((_, i) => (i + 1) % 12);
      const key = "njangi-demo-v1";
      function seed() {
        return {
          user: 0,
          payments: [],
          votes: [
            {
              id: "initial",
              g: "samedi",
              from: 1,
              to: 2,
              slot: 0,
              target: 1,
              type: "swap",
              yes: members.filter((i) => i !== 0 && i !== 2),
              status: "open",
            },
          ],
          orders: { samedi: [...circles], quartier: [...circles] },
          pots: [
            {
              id: "solidarite",
              name: "Soutenir la famille Diouf",
              why: "Une collecte de quartier pour aider la famille à remplacer le mobilier perdu après un incendie.",
              owner: 3,
              benef: "Famille Diouf",
              goal: 500000,
              base: 185000,
              gifts: [],
            },
          ],
          vault: {},
        };
      }
      let s;
      try {
        s = JSON.parse(localStorage.getItem(key)) || seed();
        const sessionUser = sessionStorage.getItem(key + "-user");
        if (
          sessionUser !== null &&
          (s.names || basePeople)[Number(sessionUser)]
        )
          s.user = Number(sessionUser);
      } catch {
        s = seed();
      }

      let groups, people;
      const demoDay = "2026-11-10";
      function initModel() {
        if (!s.meetings) {
          s.meetings = {};
          s.names = [...basePeople];
          s.wallets = { 0: 85000 };
          s.events = [];
          s.messages = {};
          s.phones = {};
          for (const [id, g] of Object.entries(baseGroups))
            s.meetings[id] = {
              ...g,
              roster: [...members],
              owner: 0,
              code: id === "samedi" ? "NJ-SAMEDI" : "NJ-QUARTIER",
              frequency: "Mensuelle",
              start: "2026-11-14",
              turn: 0,
              status: "active",
              cycle: 1,
            };
          for (const [id, name, roster, status] of [
            ["amies", "Cercle des amies", [0, 1, 2, 3], "active"],
            ["famille", "Famille Fall", [0, 1, 4], "ended"],
            ["marche", "Réunion du marché", [3, 4], "draft"],
          ]) {
            s.meetings[id] = {
              name,
              roster,
              owner: roster[0],
              direct: true,
              fee: 15000,
              code: "NJ-" + id.toUpperCase(),
              frequency: "Mensuelle",
              start: id === "famille" ? "2026-07-10" : demoDay,
              turn: status === "ended" ? roster.length : 0,
              status,
              cycle: 1,
            };
            s.orders[id] = [...roster];
          }
          for (const id of s.meetings.amies.roster)
            s.payments.push({
              id: uid(),
              g: "amies",
              forId: id,
              by: id,
              receiver: null,
              method: "Wave",
              status: "confirmed",
              slot: 0,
            });
          s.vault[0] ??= {
            balance: 125000,
            interest: 0,
            entries: [{ label: "Dépôt initial", amount: 125000 }],
          };
          s.events.push(
            {
              id: uid(),
              users: [0],
              title: "Cotisation réglée",
              detail: "Cercle des amies",
              amount: 15000,
              thread: "amies",
            },
            {
              id: uid(),
              users: [0],
              title: "Contribution à la cagnotte",
              detail: "Soutenir la famille Diouf",
              amount: 5000,
              thread: "pot-solidarite",
            },
            {
              id: uid(),
              users: [0],
              title: "Tour reçu",
              detail: "Famille Fall · cycle précédent",
              amount: 45000,
              thread: "famille",
            },
          );
          s.messages.amies = [
            {
              by: 1,
              text: "Les cotisations sont au complet. Awa, tu peux récupérer ton tour.",
            },
          ];
        }
        if (!s.meetings.voisines) {
          const roster = [0, 1, 2, 3];
          s.meetings.voisines = {
            name: "Tontine des voisines",
            roster,
            owner: 0,
            direct: false,
            fee: 5000,
            code: "NJ-VOISINES",
            frequency: "Hebdomadaire",
            start: "2026-11-02",
            turn: 1,
            status: "active",
            cycle: 1,
          };
          s.orders.voisines = [...roster];
          for (const id of roster)
            s.payments.push({
              id: "voisines-1-" + id,
              g: "voisines",
              slot: 0,
              forId: id,
              by: id,
              receiver: 0,
              method: "Espèces",
              status: "confirmed",
            });
          for (const [forId, by, status] of [
            [2, 0, "confirmed"],
            [3, 3, "declared"],
          ])
            s.payments.push({
              id: "voisines-2-" + forId,
              g: "voisines",
              slot: 1,
              forId,
              by,
              receiver: 1,
              method: "Wave",
              status,
            });
        }
        const family = s.meetings.famille;
        if (
          family?.status === "ended" &&
          !s.payments.some((p) => p.g === "famille")
        ) {
          for (const [slot, receiver] of s.orders.famille.entries())
            for (const id of family.roster)
              s.payments.push({
                id: "famille-" + slot + "-" + id,
                g: "famille",
                slot,
                forId: id,
                by: id,
                receiver,
                method: "Wave",
                status: "confirmed",
              });
        }
        groups = s.meetings;
        people = s.names;
      }
      initModel();
      function myGroups() {
        return Object.keys(groups).filter((g) =>
          groups[g].roster.includes(s.user),
        );
      }
      function turnDate(g, slot) {
        const x = groups[g],
          d = new Date(
            (x.resume && (slot >= x.imported || !x.start)
              ? x.resume
              : x.start) + "T12:00:00Z",
          );
        if (x.resume && (slot >= x.imported || !x.start)) slot -= x.imported;
        if (x.frequency === "Hebdomadaire")
          d.setUTCDate(d.getUTCDate() + slot * 7);
        else {
          const day = d.getUTCDate();
          d.setUTCDate(1);
          d.setUTCMonth(d.getUTCMonth() + slot);
          const end = new Date(
            Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0),
          ).getUTCDate();
          d.setUTCDate(Math.min(day, end));
        }
        return d;
      }
      function when(g, slot = groups[g].turn) {
        if (groups[g].resume && slot < groups[g].imported && !groups[g].start)
          return "Date non renseignée";
        return dateLabel(turnDate(g, slot));
      }
      function dateLabel(date) {
        return date.toLocaleDateString("fr-FR", {
          day: "numeric",
          month: "short",
          year: "numeric",
          timeZone: "UTC",
        });
      }
      function logEvent(
        title,
        detail,
        amount = 0,
        thread = "",
        users = [s.user],
      ) {
        s.events.unshift({
          id: uid(),
          title,
          detail,
          amount,
          thread,
          users: [...new Set(users)],
        });
      }
      const wallet = () => s.wallets[s.user] || 0;
      function received(g) {
        return s.payments.filter(
          (p) =>
            p.g === g &&
            (p.slot || 0) === groups[g].turn &&
            p.status === "confirmed",
        );
      }
      function related(p) {
        return [p.by, p.forId, ...(p.receiver === null ? [] : [p.receiver])];
      }
      function logPay(p) {
        logEvent(
          p.by === p.forId
            ? "Cotisation réglée"
            : "Cotisation pour " + people[p.forId],
          groups[p.g].name + " · " + people[p.by],
          groups[p.g].fee,
          p.g,
          related(p),
        );
      }
      const save = () => {
        try {
          sessionStorage.setItem(key + "-user", String(s.user));
          localStorage.setItem(key, JSON.stringify(s));
        } catch {
          toast("Stockage indisponible sur cet appareil.");
        }
      };
      const $ = (sel) => document.querySelector(sel),
        main = $("#main"),
        modal = $("#modal");
      let route = "",
        noticeTimer,
        formHandler;
      function toast(msg) {

      function moveMoney(kind) {
        const a = vaultAccount(),
          depositing = kind === "fund" || kind === "deposit",
          internal = kind === "deposit" || kind === "withdraw";
        const title = {
          fund: "Déposer sur mon compte",
          cashout: "Retirer de mon compte",
          deposit: "Alimenter mon coffre",
          withdraw: "Transférer vers mon compte",
        }[kind];
        const limit =
          kind === "fund"
            ? 100000000
            : kind === "withdraw"
              ? a.balance
              : wallet();
        if (!limit)
          return dialog(
            title,
            '<p class="hint">Solde disponible : 0 F CFA.</p>' +
              act("Fermer", "close", "ghost"),
            () => {},
          );
        dialog(
          title,
          field("Montant en F CFA", moneyInput("amount", limit)) +
            (internal
              ? '<p class="hint">' +
                (depositing
                  ? "De ton compte vers ton coffre."

                )) +
            submit("Vérifier"),
          (f) => {
            const amount = Number(f.get("amount")),
              method = f.get("method");
            dialog(
              "Vérifier le mouvement",
              '<div class="facts">' +
                fact("Opération", title) +

                (method ? fact("Canal", h(method)) : "") +
                fact("Frais simulés", "0 F CFA") +
                "</div>" +
                submit("Confirmer"),
              () => {
                if (
                  kind !== "fund" &&
                  amount >
                    (kind === "withdraw" ? vaultAccount().balance : wallet())
                )
                  return ($("#err").textContent = "Solde insuffisant.");
                s.wallets[s.user] =
                  wallet() +
                  (["fund", "withdraw"].includes(kind) ? amount : -amount);
                if (internal) {
                  a.balance += depositing ? amount : -amount;
                  a.entries.unshift({
                    label: depositing ? "Dépôt" : "Retrait",
                    amount,
                  });
                  s.vault[s.user] = a;
                }
                logEvent(title, method || "Coffre personnel", amount);
                finish("Mouvement enregistré.");
              },
            );
          },
        );
      }

      async function copyValue(value, label) {

          toast(label + " copié.");
          return;
        } catch {}
        const el = document.createElement("textarea");
        el.value = value;
        document.body.append(el);
        el.select();
        let copied = false;
        try {
          copied = document.execCommand("copy");
        } catch {}
        el.remove();
        if (copied) return toast(label + " copié.");
        dialog(
          "Copie manuelle",
          field(
            label,
            '<input id="manualCopy" readonly value="' + h(value) + '">',
          ),
          () => {},
        );
        $("#manualCopy").select();

      function pendingAdmissions() {
        return Object.entries(groups)
          .filter(([, x]) => x.owner === s.user)
          .flatMap(([g, x]) =>
            (x.requests || [])
              .filter((r) => r.status === "pending")
              .map((r) => ({ g, user: r.user })),
          );

      function requestJoin(g) {
        const x = groups[g];
        if (
          !s.visited ||
          !x ||
          !canJoin(x) ||
          x.roster.includes(s.user) ||
          x.requests?.some((r) => r.user === s.user)
        )
          return;
        x.requests ??= [];
        x.requests.push({ user: s.user, status: "pending" });
        finish("Demande transmise à " + people[x.owner] + ".");
      }
      function admissions(g) {
        const x = groups[g];
        if (x.owner !== s.user) return "";
        const requests = (x.requests || []).filter(
          (r) => r.status === "pending",
        );
        return requests.length
          ? section("Demandes à traiter") +
              requests
                .map(
                  (r) =>
                    '<div class="card"><strong>' +
                    h(people[r.user]) +
                    '</strong><div class="controls">' +
                    act("Accepter", "acceptjoin:" + g + ":" + r.user) +
                    act("Refuser", "refusejoin:" + g + ":" + r.user, "ghost") +
                    "</div></div>",
                )
                .join("")
          : "";
      }
      function decideAdmission(g, user, accept) {
        const x = groups[g],
          r = x.requests?.find((r) => r.user === user);
        if (x.owner !== s.user || r?.status !== "pending") return;
        if (accept) {
          if (!canJoin(x)) return toast("Les inscriptions sont closes.");
          if (!x.roster.includes(user)) {
            x.roster.push(user);
            s.orders[g].push(user);
          }
        }
        r.status = accept ? "accepted" : "refused";
        if (!canJoin(x))
          for (const waiting of x.requests)
            if (waiting.status === "pending") waiting.status = "closed";
        logEvent(
          accept ? "Demande acceptée" : "Demande refusée",
          x.name,
          0,
          accept ? g : "",
          [user],
        );
        finish(accept ? "Membre accepté." : "Demande refusée.");

      function claim(g) {
        const x = groups[g],
          slot = x.turn,
          order = s.orders[g],
          amount = received(g).length * x.fee;
        if (
          x.status !== "active" ||
          order[slot] !== s.user ||
          received(g).length !== x.roster.length ||
          openVote(g)

          return;
        dialog(
          x.direct ? "Récupérer mon tour" : "Attester la remise",
          '<div class="facts">' +
            fact("Réunion", h(x.name)) +
            fact("Montant collecté", money(amount)) +

            ) +
            "</div>" +
            submit(x.direct ? "Créditer mon compte" : "J’ai reçu la somme"),
          () => {
            if (x.turn !== slot) return;

              x.direct ? "Tour reçu sur mon compte" : "Remise externe attestée",
              x.name,
              amount,

      function manage(g) {
        const x = groups[g];
        if (!x.parent || s.user !== x.owner || x.status === "ended") return;
        const locked = (id) =>
          id === x.owner ||
          s.payments.some(
            (p) =>
              p.g === g &&
              p.status !== "disputed" &&
              (p.forId === id || p.by === id),
          ) ||
          s.orders[g].slice(0, x.turn).includes(id) ||
          !!openVote(g);
        dialog(
          "Membres du nouveau cycle",
          x.roster
            .map(
              (id) =>
                '<label class="check"><input type="checkbox" name="keep" value="' +
                id +
                '" checked ' +
                (locked(id) ? "disabled" : "") +
                ">" +
                h(people[id]) +
                (locked(id) ? " · conservé" : "") +
                "</label>",
            )
            .join("") +
            '<p class="small">Décoche les membres à retirer. Les membres ayant déjà cotisé ou reçu une cotisation pour eux sont conservés.</p>' +
            submit("Enregistrer la liste"),
          (f) => {
            const keep = f.getAll("keep").map(Number);
            const next = x.roster.filter(
              (id) => locked(id) || keep.includes(id),

            if (x.status === "active" && next.length < 2)
              return ($("#err").textContent =
                "Un cycle actif requiert deux membres.");
            x.roster = next;
            s.orders[g] = s.orders[g].filter((id) => next.includes(id));
            finish("Liste mise à jour.");
          },
        );
      }

          content =
            hubHead(false) +
            (myGroups().map(groupRow).join("") ||
              '<p class="blank">Tu peux rejoindre ta première réunion avec son code.</p>');
        else if (route === "invite") content = invitation(id);
        else if (route === "share" && myGroups().includes(id))
          content = shareMeeting(id, tab === "created");
        else if (route === "group" && myGroups().includes(id))
          content = groupView(id, tab);
        else if (route === "vote" && v && myGroups().includes(v.g))
          content = voteView(v);
        else if (route === "pots") content = potList();
        else if (route === "pot" && p)
          content =
            potView(p) +
            link("Discussion de la cagnotte", "thread/pot-" + p.id, "link");
        else if (route === "thread" && id && chatAccess(id))
          content =
            back("chat") +
            head("Discussion", h(threadName(id))) +
            conversation(id);
        else if (route === "chat" || route === "history")
          content = searchPage(route === "history");
        else if (route === "profile") content = profile();
        else if (route === "vault") content = vault();
        else
          content =
            head("Navigation", "Page indisponible") +
            link("Retour à l’accueil", "home", "btn");
        main.innerHTML = content;
        document.title =
          (main.querySelector("h1")?.textContent || "Mon espace") + " · Bokk";
      }
      function voteAction(k, v) {
        if (!v || !groups[v.g].roster.includes(s.user) || v.status !== "open")
          return;
        if (k === "expire") v.status = "expired";
        else {
          if (v.yes.includes(s.user)) return;
          if (k === "no") {
            v.status = "refused";
            v.no = s.user;
          } else {
            v.yes.push(s.user);
            if (v.yes.length === groups[v.g].roster.length) {
              changes(v).forEach(([i, , to]) => (s.orders[v.g][i] = to));
              v.status = "approved";
            }
          }
        }
        save();
        render();
        toast(
          v.status === "approved"
            ? "Accord unanime. Calendrier mis à jour."
            : "Décision enregistrée.",
        );
      }
      function run(action) {
        const [k, id] = action.split(":"),
          p = s.payments.find((x) => x.id === id),
          pot = s.pots.find((x) => x.id === id),
          v = s.votes.find((x) => x.id === id);
        switch (k) {
          case "copycode":
            copyValue(groups[id].code, "Code");
            break;
          case "copyinvite":
            copyValue(invitationUrl(id), "Lien");
            break;
          case "sendinvite":
            sendInvite(id);
            break;
          case "authinvite":
            enroll("invite/" + groups[id].code);
            break;
          case "requestjoin":
            requestJoin(id);
            break;
          case "acceptjoin":
          case "refusejoin":
            decideAdmission(
              id,
              Number(action.split(":")[2]),
              k === "acceptjoin",
            );
            break;
          case "demo":
            s.user = 0;
            s.visited = true;
            flipped = false;
            finish("Profil de démonstration", "home");
            break;
          case "enroll":
            enroll();
            break;
          case "flip":
            flipped = !flipped;
            render();
            main
              .querySelector('[data-act="flip"]')
              ?.focus({ preventScroll: true });
            break;
          case "openvault":
            go("vault");
            break;
          case "join":
            joinGroup();
            break;
          case "fund":
          case "cashout":
            moveMoney(k);
            break;
          case "meeting":
            addMeeting(id);
            break;
          case "claim":
            claim(id);
            break;
          case "renew":
            renew(id);
            break;
          case "manage":
            manage(id);
            break;
          case "start":
            startCycle(id);
            break;
          case "event": {
            const e = s.events.find(
              (e) => e.id === id && e.users.includes(s.user),
            );
            if (e)
              dialog(
                h(e.title),
                "<p>" +
                  h(e.detail) +
                  "</p>" +
                  (e.amount ? fact("Montant", money(e.amount)) : "") +
                  (e.thread
                    ? link(
                        "Retrouver la conversation",
                        "thread/" + e.thread,
                        "btn",
                      )
                    : ""),
                () => {},
              );
            break;
          }
          case "close":
            modal.close();
            break;
          case "pay":
            pay(id);
            break;
          case "receipt":
            showReceipt(p);
            break;
          case "attest":
          case "dispute":
            if (p?.receiver === s.user && p.status === "declared") {
              p.status = k === "attest" ? "confirmed" : "disputed";
              if (k === "attest") logPay(p);
              save();
              render();
              showReceipt(p);
            }
            break;
          case "newvote":
            newVote(id);
            break;
          case "yes":
          case "no":
          case "expire":
            voteAction(k, v);
            break;
          case "newpot":
            newPot();
            break;
          case "give":
            donate(pot);
            break;
          case "share":
            share(pot);
            break;
          case "copylink": {
            const el = $("#shareUrl");
            el.select();
            if (navigator.clipboard?.writeText)
              navigator.clipboard
                .writeText(el.value)
                .then(() => toast("Lien copié."))
                .catch(() =>
                  toast("Lien sélectionné. Utilise la commande Copier."),
                );
            else toast("Lien sélectionné. Utilise la commande Copier.");
            break;
          }
          case "remit":
            if (pot?.owner !== s.user) return;
            dialog(
              "Verser au bénéficiaire",
              field(
                "Montant à remettre en F CFA",
                moneyInput("amount", potTotal(pot) - (pot.sent || 0)),
              ) +
                '<p class="small">Destinataire · ' +
                h(pot.benef) +
                "</p>" +
                submit("Simuler le versement"),
              (f) => {
                pot.sent = (pot.sent || 0) + Number(f.get("amount"));
                save();
                modal.close();
                render();
                toast("Versement simulé enregistré.");
              },
            );
            break;
          case "deposit":
          case "withdraw":
            moveMoney(k);
            break;
          case "shortcuts":
            shortcuts();
            break;
          case "alerts":
            notifications();
            break;
          case "reset":
            dialog(
              "Recommencer la démonstration ?",
              '<p class="bodycopy">Les opérations de test seront effacées et les profils retrouveront leur état initial.</p><div class="controls">' +
                submit("Réinitialiser la démo") +
                "</div>",
              () => {
                s = seed();
                initModel();
                flipped = false;
                save();
                clearTimeout(payTimer);
                modal.close();
                go("welcome");
              },
            );
            break;
        }
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-go],[data-act]");
        if (!b) return;
        e.preventDefault();
        if (b.dataset.go) {
          if (modal.open) modal.close();
          go(b.dataset.go);
        } else run(b.dataset.act);
      });
      function onBackdrop(event) {
        if (event.target !== modal) return false;
        const box = modal.getBoundingClientRect();
        return (
          event.clientX < box.left ||
          event.clientX >= box.right ||
          event.clientY < box.top ||
          event.clientY >= box.bottom
        );
      }
      let pressedBackdrop = false;
      modal.addEventListener("pointerdown", (event) => {
        pressedBackdrop = onBackdrop(event);
      });
      modal.addEventListener("click", (event) => {
        if (pressedBackdrop && onBackdrop(event)) modal.close();
        pressedBackdrop = false;
      });
      modal.addEventListener("submit", (e) => {
        e.preventDefault();
        formHandler?.(new FormData(e.target));
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "switchUser") {
          s.user = Number(e.target.value);
          flipped = false;
          s.visited = true;
          finish("Profil de " + people[s.user], "home");
        }
      });
      main.addEventListener("input", (e) => {
        if (e.target.id === "search")
          $("#results").innerHTML =
            route === "history"
              ? historyList(e.target.value)
              : threadList(e.target.value);
      });
      main.addEventListener("submit", (e) => {
        const t = e.target.dataset.thread;
        if (!t || !chatAccess(t)) return;
        e.preventDefault();
        const msg = String(new FormData(e.target).get("message")).trim();
        if (!msg) return;
        s.messages[t] ??= [];
        s.messages[t].push({ by: s.user, text: msg });
        logEvent("Message envoyé", threadName(t), 0, t);
        save();
        render();
        main.scrollTop = main.scrollHeight;
      });
      window.addEventListener("storage", (event) => {
        if (event.key !== key || !event.newValue) return;
        const incoming = JSON.parse(event.newValue),
          user = s.user;
        if (incoming.names?.[user]) incoming.user = user;
        s = incoming;
        initModel();
        if (modal.open) modal.close();
        render();
        schedulePayments();
      });
      window.addEventListener("hashchange", () => {
        if (modal.open) modal.close();
        render();
        main.scrollTop = 0;
      });
      render();
      schedulePayments();
    </script>
  </body>
</html>
