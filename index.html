        else if (type === "cagnotte") corps = champ("Titre", '<input name="nom" maxlength="60" required placeholder="Soutenir la famille Diouf">') + champ("Pourquoi ?", '<input name="why" maxlength="160" required>') + champ("Bénéficiaire", '<input name="benef" maxlength="60" required>') + champ("Objectif (F CFA, facultatif)", '<input type="number" name="goal" min="0" step="1000">');
        else if (type === "projet") corps = champ("Nom du projet", '<input name="nom" maxlength="60" required>') + champ("Objectif (F CFA)", '<input type="number" name="goal" min="1000" step="1000" required>') + champ("Date limite", '<input type="date" name="deadline" value="' + addMonths(AUJ, 1) + '" required>') + '<div class="soustitre" style="margin-top:6px">Participation</div>' + choixPilules("part", [["quote", "Même montant pour tous"], ["libre", "Montant libre"]]) + champ("Montant par membre (si le même pour tous)", '<input type="number" name="quote" min="100" step="100">') + modeChoix;
        else corps = champ("Nom", '<input name="nom" maxlength="48" value="' + (type === "epargne" ? "Épargne commune" : "Cotisation mensuelle") + '" required>') + champ("Montant par personne et par mois (F CFA)", '<input type="number" inputmode="numeric" name="fee" min="100" step="100" required>') + champ("À payer avant le", '<select name="dueDay">' + [5, 10, 15, 20, 25, 28].map((d) => '<option value="' + d + '"' + (d === 15 ? " selected" : "") + ">" + d + " de chaque mois</option>").join("") + "</select>") + (type === "epargne" ? champ("Jusqu’au", '<input type="date" name="end" value="' + addMonths(AUJ, 6) + '" required>') : "") + '<p class="hint">Les membres pourront demander un prêt sur cet argent ; tu fixeras les conditions ensuite.</p>' + modeChoix;
        feuille(
          TYPES[type][0] + (gid ? " · " + h(G(gid).name) : " · activité seule"),
          corps + valider("Créer"),
          (f) => {
            const id = uid(), base = { id, g: gid || null, type, name: String(f.get("nom")).trim(), status: "active", mode: f.get("mode") || "bokk", members: gid ? [] : [moi()], requests: [], inscrits: [], owner: moi(), code: gid ? null : "BK-" + id.slice(0, 5).toUpperCase() };
            if (type === "tontine") {
              const passes = f.get("deja") ? Number(f.get("passes") || 0) : 0;
              Object.assign(base, { fee: Number(f.get("fee")), freq: f.get("freq"), start: f.get("start"), order: [], turn: 0, status: "inscriptions", inscrits: [moi()], passes });
            } else if (type === "cagnotte") Object.assign(base, { why: f.get("why"), benef: String(f.get("benef")).trim(), goal: Number(f.get("goal") || 0), mode: "bokk" });
            else if (type === "projet") {
              const quote = f.get("part") === "quote" ? Number(f.get("quote")) : 0;
              if (f.get("part") === "quote" && !quote) return erreur("Indique le montant par membre.");
              Object.assign(base, { goal: Number(f.get("goal")), deadline: f.get("deadline"), quote });
            } else Object.assign(base, { fee: Number(f.get("fee")), dueDay: Number(f.get("dueDay")), start: AUJ, end: f.get("end") || null, pret: { plafond: 20000, dureeMax: 3, taux: 0 } });
            S.acts[id] = base;
            logEvent([moi()], "Activité créée", base.name, 0, gid || id);
            fin("Activité créée.", "a/" + id, gid ? null : () => feuilleInviter("a", id));
          },
        );
      }
      function feuilleRejoindre() {
        feuille("Rejoindre", champ("Code reçu", '<input name="code" required placeholder="BK-MARCHE" autocomplete="off" style="text-transform:uppercase">') + '<p class="small" style="margin:0 2px">Codes à essayer : BK-MARCHE (un groupe), BK-DIOUF (une cagnotte).</p>' + valider("Voir"), (f) => fin("", "rejoindre/" + String(f.get("code")).trim().toUpperCase()));
      }
      function feuilleInviter(kind, id) {
        const x = kind === "g" ? G(id) : A(id), url = location.href.split("#")[0] + "#rejoindre/" + x.code;
        feuille(
          "Inviter",
          '<div class="recap"><small>Code</small><span class="gros" style="letter-spacing:.06em">' + h(x.code) + "</span></div>" + champ("Lien d’invitation", '<input readonly id="lienInvit" value="' + h(url) + '">') + '<p class="hint">Partage le lien sur WhatsApp. Chaque personne voit de quoi il s’agit, puis demande à rejoindre ; tu acceptes.</p>' + '<div class="controls">' + act("Partager sur WhatsApp", "partage:" + kind + ":" + id) + act("Copier le code", "copier:" + x.code, "ghost") + "</div>",
        );
      }
      function feuilleHabilitees(gid) {
        const g = G(gid), orga = g.nature === "organisation";
        feuille(
          "Personnes habilitées",
          '<p class="small" style="margin:0 2px 8px">Elles proposent et confirment les retraits et les prêts ; les membres approuvent toujours. ' + (orga ? "Une organisation en nomme deux." : "Une suffit ; deux si le groupe le souhaite.") + "</p>" +
            g.members.map((u) => '<label class="check"><input type="checkbox" name="r" value="' + u + '"' + (g.resp.includes(u) ? " checked" : "") + "> " + h(nom(u)) + (u === moi() ? " (toi)" : "") + "</label>").join("") + '<p class="hint">Tous les membres seront prévenus du changement.</p>' + valider("Enregistrer"),
          (f) => {
            const r = f.getAll("r").map(Number);
            if (!r.length || r.length > 2) return erreur("Choisis une ou deux personnes.");
            if (orga && r.length !== 2) return erreur("Une organisation nomme deux personnes habilitées.");
            g.resp = r;
            logEvent(g.members, "Personnes habilitées changées", g.name + " · " + r.map(prenom).join(" et "), 0, gid);
            fin("Personnes habilitées mises à jour. Les membres sont prévenus.", null);
          },
        );
      }
      function feuilleAdmission(kind, id, u) {
        const x = kind === "g" ? G(id) : A(id);
        feuille("Demande pour rejoindre", '<div class="recap" style="display:flex;align-items:center;gap:14px">' + ava(u) + "<div><b>" + h(nom(u)) + '</b><small style="display:block">+221 ' + h(S.people[u].phone) + "</small></div></div>" + '<p class="small" style="margin:0 2px">Veut rejoindre <b>' + h(x.name) + '</b>.</p><div class="controls">' + act("Accepter", "accepte:" + kind + ":" + id + ":" + u) + act("Refuser", "refuse-membre:" + kind + ":" + id + ":" + u, "danger") + "</div>");
      }
      function feuilleNotifs() {
        const items = aFaire();
        feuille("Notifications", '<div class="notifs">' + (items.length ? items.map(carteNotif).join("") : '<p class="hint">Tu es à jour.</p>') + "</div>");
      }
      function feuilleArgent(kind) {
        const c = coffre(), versCoffre = kind === "deposit", depuisCoffre = kind === "withdraw", interne = versCoffre || depuisCoffre;
        const titre = { fund: "Déposer sur mon compte", cashout: "Retirer de mon compte", deposit: "Alimenter mon coffre", withdraw: "Retirer du coffre" }[kind];
        const max = kind === "fund" ? 1e8 : depuisCoffre ? c.balance : wallet();
        feuille(
          titre,
          '<div class="recap"><small>' + (kind === "fund" ? "Compte Bokk" : depuisCoffre ? "Dans le coffre" : "Disponible") + '</small><span class="gros">' + F(depuisCoffre ? c.balance : wallet()) + "</span></div>" + champ("Montant (F CFA)", '<input type="number" inputmode="numeric" name="montant" min="1" max="' + max + '" required>') +
            (interne ? '<p class="hint">' + (versCoffre ? "De ton compte vers ton coffre." : "De ton coffre vers ton compte.") + "</p>" : '<div class="soustitre">' + (kind === "fund" ? "Depuis" : "Vers") + "</div>" + choixPilules("moyen", [["Wave", "Wave"], ["Orange Money", "Orange Money"]])) +
            '<div class="facts">' + fait("Frais", "0 F (simulés)") + "</div>" + champPin() + valider("Confirmer"),
          (f) => {
            if (!pinOk(f)) return erreur("Code secret incorrect.");
            const m = Number(f.get("montant"));
            if (!m || m > max) return erreur("Solde insuffisant.");
            const me = moi();
            S.wallets[me] = wallet() + (kind === "fund" || depuisCoffre ? m : -m);
            if (interne) { S.vault[me] = c; c.balance += versCoffre ? m : -m; c.entries.unshift({ label: versCoffre ? "Dépôt" : "Retrait", amount: m, date: AUJ }); }
            logEvent([me], titre, f.get("moyen") || "Coffre", m);
            fin("Opération enregistrée.", null);
          },
        );
      }
      function feuillePin() {
        feuille("Code secret", '<label class="field pinfield">Code actuel<input type="password" name="pin" inputmode="numeric" maxlength="4" required></label><label class="field pinfield">Nouveau code (4 chiffres)<input type="password" name="nouveau" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><p class="small" style="margin:0 2px">Démo : ' + PIN_DEMO + "</p>" + valider("Changer"), (f) => {
          if (!pinOk(f)) return erreur("Code actuel incorrect.");
          if (!/^\d{4}$/.test(f.get("nouveau"))) return erreur("Quatre chiffres.");
          S.people[moi()].pin = f.get("nouveau");
          fin("Code secret changé.", null);
        });
      }

      // connexion
      function verifierNumero(f, err) {
        const phone = String(f.get("phone")).replace(/[ ()-]/g, "").replace(/^\+221/, "");
        if (!/^7\d{8}$/.test(phone)) return (err.textContent = "Saisis un numéro mobile sénégalais à 9 chiffres.");
        err.textContent = "";
        const joli = phone.replace(/(\d{2})(\d{3})(\d{2})(\d{2})/, "$1 $2 $3 $4");
        feuille("Vérifier mon numéro", '<p class="hint">Code de simulation pour le +221 ' + joli + " : <strong>123456</strong>.</p>" + champ("Code à 6 chiffres", '<input name="otp" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>') + valider("Vérifier"), (f2) => {
          if (f2.get("otp") !== "123456") return erreur("Code incorrect. Utilise le code affiché.");
          const deja = S.people.findIndex((p) => p.phone === joli);
          if (deja >= 0) { S.user = deja; S.visited = true; return fin("Compte retrouvé.", "accueil"); }
          feuille("Créer mon profil", champ("Prénom et nom", '<input name="name" autocomplete="name" required maxlength="48">') + '<label class="field pinfield">Choisis ton code secret (4 chiffres)<input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><p class="small" style="margin:-6px 2px 10px">Il sera demandé pour chaque opération d’argent.</p>' + valider("Ouvrir mon compte"), (f3) => {
            const n = String(f3.get("name")).trim();
            if (!/^[\p{L}][\p{L} .’'-]{1,47}$/u.test(n)) return erreur("Vérifie le prénom et le nom.");
            if (!/^\d{4}$/.test(f3.get("pin"))) return erreur("Le code secret fait 4 chiffres.");
            S.user = S.people.push({ name: n, phone: joli, pin: f3.get("pin") }) - 1;
            S.wallets[S.user] = 0;
            S.visited = true;
            fin("Ton compte est prêt.", "accueil");
          });
        });
      }

      // ---------- rendu ----------
      const main = $("#main");
      function render() {
        const [page, id, onglet] = location.hash.slice(1).split("/");
        let route = page || (S.visited ? "accueil" : "bienvenue");
        if (!S.visited) route = "bienvenue";
        const hs = $(".handset");
        hs.classList.toggle("intro", route === "bienvenue");
        hs.dataset.route = route === "accueil" ? "home" : route;
        const actif = { accueil: "accueil", groupes: "groupes", g: "groupes", a: "groupes", rejoindre: "groupes", discussions: "discussions", fil: "discussions", profil: "profil", coffre: "accueil", historique: "accueil" }[route];
        $("#nav").innerHTML = [["accueil", "Accueil", "home"], ["groupes", "Groupes", "groups"], ["plus", "Créer ou rejoindre", "plus"], ["discussions", "Discussions", "chat"], ["profil", "Profil", "user"]]
          .map(([k, l, ic]) => (k === "plus" ? '<button class="nav central" data-act="plus" aria-label="' + l + '"><i>' + icon(ic) + "</i></button>" : '<button class="nav ' + (actif === k ? "on" : "") + '" data-go="' + k + '"' + (actif === k ? ' aria-current="page"' : "") + ">" + icon(ic) + l + "</button>")).join("");
        const n = S.visited ? aFaire().length : 0;
        $("#alerts").innerHTML = icon("bell") + (n ? "<b>" + n + "</b>" : "");
        $("#alerts").setAttribute("aria-label", "Notifications, " + n + " en attente");
        $("#ava").textContent = initiales(moi());
        $("#personName").textContent = prenom(moi());
        let html;
        if (route === "bienvenue") html = bienvenue();
        else if (route === "accueil") html = accueil();
        else if (route === "groupes") html = pageGroupes(id);
        else if (route === "g" && G(id)?.members.includes(moi())) html = pageGroupe(id, onglet);
        else if (route === "a" && A(id) && (membresAct(A(id)).includes(moi()) || A(id).inscrits?.includes(moi()))) html = pageActivite(id);
        else if (route === "discussions") html = pageDiscussions();
        else if (route === "fil" && id) html = back("discussions") + titrePage("Discussion", h(nomFil(id))) + conversation(id);
        else if (route === "profil") html = pageProfil();
        else if (route === "coffre") html = pageCoffre();
        else if (route === "historique") html = pageHistorique();
        else if (route === "rejoindre") html = pageRejoindre(id);
        else html = titrePage("", "Page introuvable") + lien("Retour à l’accueil", "accueil", "btn");
        main.innerHTML = html;
        document.title = (route === "accueil" ? "Accueil" : main.querySelector("h1")?.textContent || "Bokk") + " · Bokk";
      }
      let toastTimer;
      function toast(m) { $("#notice").textContent = m; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($("#notice").textContent = ""), 3600); }
      async function partager(texte, url) {
        if (navigator.share) { try { await navigator.share({ text: texte, url }); return; } catch (e) { if (e.name === "AbortError") return; } }
        try { await navigator.clipboard.writeText(texte + (url ? " " + url : "")); toast("Copié : colle-le dans WhatsApp."); } catch { toast("Partage indisponible ici (simulation)."); }
      }

      // ---------- les actions ----------
      function run(action) {
        const [k, x, y, z] = action.split(":");
        const p = S.pays.find((e) => e.id === x), d = S.decisions.find((e) => e.id === x);
        switch (k) {
          case "fermer": return modal.close();
          case "demo": S.user = 0; S.visited = true; retourne = false; return fin("Profil de démonstration : Awa", "accueil");
          case "retourner": retourne = !retourne; render(); main.querySelector(".balance")?.classList.add("flipping"); return;
          case "notifs": return feuilleNotifs();
          case "plus": return feuillePlus();
          case "creer": return feuilleCreer();
          case "quoi": return feuilleQuoi(x || null);
          case "type": return feuilleReglages(x, y || null);
          case "rejoindre": return feuilleRejoindre();
          case "coffre": return fin("", "coffre");
          case "argent": return feuilleArgent(x);
          case "pin": return feuillePin();
          case "payer": return feuillePayer(x);
          case "recu": return feuilleRecu(x);
          case "recuperer": return feuilleRecuperer(x);
          case "atteste":
          case "ecart":
            if (p?.status === "declared" && p.to === moi()) {
              p.status = k === "atteste" ? "confirmed" : "disputed";
              if (k === "atteste") logEvent([p.by, p.forId, moi()], "Cotisation confirmée", A(p.a).name, p.amount, A(p.a).g || p.a);
              save(); render(); feuilleRecu(p.id);
              toast(k === "atteste" ? "Réception confirmée. " + prenom(p.by) + " est prévenu." : prenom(p.by) + " est prévenu : la cotisation reste à régler.");
            }
            return;
          case "retrait": return feuilleRetrait(x);
          case "verser": return feuilleVerser(x);
          case "pret": return feuillePret(x);
          case "conditions": return feuilleConditions(x);
          case "voirpret": return feuilleVoirPret(x);
          case "rembourser": return feuilleRembourser(x);
          case "decision": return feuilleDecision(x);
          case "signe":
            if (d && aMoi(d) && aMoi(d) !== "vote") { d.signs.push(moi()); avancerDecision(d); fin(d.status === "ok" ? "Approuvé." : d.status === "vote" ? "Les membres sont appelés à voter." : "Envoyé à la seconde personne habilitée.", null); }
            return;
          case "rejette":
            if (d && aMoi(d)) { d.status = "refuse"; fin("Demande refusée. " + prenom(d.by) + " est prévenu.", null); }
            return;
          case "oui":
          case "non":
            if (d && aMoi(d) === "vote") {
              (k === "oui" ? d.yes : d.no).push(moi());
              avancerDecision(d);
              fin(d.status === "ok" ? (d.kind === "pret" ? "Prêt approuvé : l’argent est versé." : d.kind === "retrait" ? "Retrait approuvé : l’argent est versé." : "Tout le monde a accepté : le calendrier change.") : d.status === "refuse" ? "Demande refusée." : "Ton avis est enregistré.", null);
            }
            return;
          case "expire":
            if (d && ["demande", "confirmation", "vote"].includes(d.status)) { d.status = "expire"; fin("Délai dépassé : la demande est refusée.", null); }
            return;
          case "echange": return feuilleEchange(x);
          case "demarrer": return feuilleDemarrer(x);
          case "inscrire": { const a = A(x); if (!a.inscrits.includes(moi())) a.inscrits.push(moi()); return fin("Tu participes à « " + a.name + " ».", null); }
          case "inviter": return feuilleInviter(x, y);
          case "partage": { const o = x === "g" ? G(y) : A(y); return partager("Rejoins « " + o.name + " » sur Bokk avec le code " + o.code + ".", $("#lienInvit")?.value); }
          case "copier": navigator.clipboard?.writeText(x).then(() => toast("Code copié."), () => toast("Code : " + x)); return;
          case "habilitees": return feuilleHabilitees(x);
          case "admission": return feuilleAdmission(x, y, Number(z));
          case "accepte":
          case "refuse-membre": {
            const o = x === "g" ? G(y) : A(y), r = o.requests.find((q) => q.u === Number(z));
            if (!r || r.status !== "pending") return;
            r.status = k === "accepte" ? "accepted" : "refused";
            if (k === "accepte") { if (!o.members.includes(r.u)) o.members.push(r.u); if (x === "a" && o.type === "tontine" && o.status === "inscriptions") o.inscrits.push(r.u); }
            return fin(k === "accepte" ? nom(r.u) + " a rejoint « " + o.name + " »." : "Demande refusée.", null);
          }
          case "demande": {
            const o = x === "g" ? G(y) : A(y);
            if (o.members.includes(moi()) || o.requests.some((q) => q.u === moi())) return;
            o.requests.push({ u: moi(), status: "pending" });
            return fin("Demande envoyée.", null);
          }
          case "rejoindre-cagnotte": { const a = A(x); if (!a.members.includes(moi())) a.members.push(moi()); return fin("", "a/" + x, () => feuillePayer(x)); }
          case "reset": return feuille("Recommencer la démo ?", '<p class="small">Toutes les opérations de test seront effacées.</p>' + valider("Réinitialiser"), () => { S = seed(); retourne = false; fin("Démo réinitialisée.", "bienvenue"); });
        }
      }
      document.addEventListener("click", (ev) => {
        const b = ev.target.closest("[data-go],[data-act]");
        if (!b || b.disabled) return;
        ev.preventDefault();
        if (b.dataset.go) { if (modal.open) modal.close(); if (location.hash.slice(1) === b.dataset.go) render(); else location.hash = b.dataset.go; }
        else run(b.dataset.act);
      });
      let appuiFond = false;
      const surFond = (ev) => { if (ev.target !== modal) return false; const r = modal.getBoundingClientRect(); return ev.clientX < r.left || ev.clientX >= r.right || ev.clientY < r.top || ev.clientY >= r.bottom; };
      modal.addEventListener("pointerdown", (ev) => (appuiFond = surFond(ev)));
      modal.addEventListener("click", (ev) => { if (appuiFond && surFond(ev)) modal.close(); appuiFond = false; });
      modal.addEventListener("submit", (ev) => { ev.preventDefault(); surEnvoi?.(new FormData(ev.target)); });
      main.addEventListener("submit", (ev) => {
        if (ev.target.id === "signin") { ev.preventDefault(); verifierNumero(new FormData(ev.target), $("#signin-error")); return; }
        const t = ev.target.dataset.fil;
        if (!t) return;
        ev.preventDefault();
        const msg = String(new FormData(ev.target).get("message")).trim();
        if (!msg) return;
        (S.messages[t] ??= []).push({ by: moi(), text: msg });
        save(); render(); main.scrollTop = main.scrollHeight;
      });
      document.addEventListener("change", (ev) => {
        if (ev.target.id === "profil") { S.user = Number(ev.target.value); S.visited = true; retourne = false; fin("Tu vois maintenant l’appli comme " + prenom(S.user) + ".", "accueil"); }
      });
      window.addEventListener("hashchange", () => { if (modal.open) modal.close(); render(); main.scrollTop = 0; if (apres) { const f = apres; apres = null; f(); } });
      window.addEventListener("storage", (ev) => { if (ev.key !== KEY || !ev.newValue) return; const u = S.user; S = JSON.parse(ev.newValue); S.user = u; render(); });
      render();
      confirmerPaiements();
    </script>
  </body>
</html>
